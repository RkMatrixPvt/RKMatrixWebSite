<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKMatrix | Jyotish Calculation Workspace</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%2310243e%22/%3E%3Ctext x=%225%22 y=%2244%22 font-family=%22Arial,sans-serif%22 font-size=%2230%22 font-weight=%22800%22 fill=%22%23f4511e%22%3ERK%3C/text%3E%3C/svg%3E">
    <style>
        :root{
            --rk-navy:#10243e;
            --rk-navy-2:#17395f;
            --rk-gold:#c8a24d;
            --rk-gold-soft:#f4ead0;
            --rk-ink:#172033;
            --rk-muted:#667085;
            --rk-bg:#eef2f7;
            --rk-card:#ffffff;
            --rk-border:#d9e0ea;
            --rk-green:#168a63;
            --rk-green-soft:#e8f7f0;
            --rk-red:#b42318;
            --rk-shadow:0 12px 32px rgba(16,36,62,.10);
        }
        *{box-sizing:border-box}
        body{
            margin:0;
            padding:28px 18px 40px;
            font-family:"Segoe UI",Arial,"Noto Sans Devanagari",sans-serif;
            font-size:14px;
            font-weight:500;
            color:var(--rk-ink);
            background:
                radial-gradient(circle at 10% 0%, rgba(200,162,77,.12), transparent 28%),
                linear-gradient(180deg,#f7f9fc 0%,var(--rk-bg) 100%);
        }
        .container{
            width:100%;
            max-width:1180px;
            margin:0 auto;
            padding:0 0 24px;
            background:transparent;
            border-radius:0;
            box-shadow:none;
        }
        .rk-brand{
            display:flex;align-items:center;justify-content:space-between;gap:28px;
            padding:20px 24px;border-radius:20px;color:var(--rk-navy);
            background:linear-gradient(135deg,#ffffff 0%,#fffdf8 58%,#f7f0df 100%);
            border:1px solid #e2d5b8;box-shadow:0 16px 38px rgba(16,36,62,.11);
            margin-bottom:16px;position:relative;overflow:hidden;
        }
        .rk-brand:before{
            content:"";position:absolute;left:0;right:0;bottom:0;height:4px;
            background:linear-gradient(90deg,#f4511e 0%,#f4511e 20%,var(--rk-gold) 48%,#10243e 72%,#168a63 100%);
        }
        .rk-brand:after{
            content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-100px;top:-155px;
            background:radial-gradient(circle,rgba(200,162,77,.16),rgba(200,162,77,0) 68%);pointer-events:none;
        }
        .rk-brand-left{display:flex;align-items:center;gap:18px;position:relative;z-index:1;min-width:0}
        .rk-logo-link{display:block;flex:0 0 auto;line-height:0;border-radius:10px;padding:4px;transition:transform .2s ease}
        .rk-logo-svg{display:block;width:min(410px,43vw);max-width:100%;height:auto;overflow:visible;transition:transform .2s ease,filter .2s ease}
        .rk-logo-link:hover{transform:translateY(-1px)}
        .rk-logo-link:hover .rk-logo-svg{filter:drop-shadow(0 6px 10px rgba(16,36,62,.16))}
        .rk-brand-copy{border-left:1px solid #e6dcc6;padding-left:18px}
        .rk-brand h1{margin:0;font-size:21px;line-height:1.15;letter-spacing:.3px;color:var(--rk-navy)}
        .rk-brand p{margin:5px 0 0;color:#667085;font-size:12px;font-weight:600}
        .rk-status{
            position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-end;gap:10px;
            flex:0 0 auto;min-width:210px;
        }
        .rk-live{
            padding:7px 11px;border:1px solid #d8e2ee;border-radius:999px;
            background:rgba(247,251,255,.9);font-size:11px;color:#34506f;white-space:nowrap;font-weight:800
        }
        .rk-live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:7px}
        .rk-site-link{
            display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:9px;
            background:var(--rk-navy);color:#fff;text-decoration:none;font-size:12px;font-weight:800;
            box-shadow:0 5px 12px rgba(16,36,62,.14);transition:.18s ease
        }
        .rk-site-link:hover{background:var(--rk-navy-2);transform:translateY(-1px)}
        .top-buttons{
            margin:0 0 18px;
            padding:12px;
            background:rgba(255,255,255,.9);
            border:1px solid var(--rk-border);
            border-radius:14px;
            box-shadow:0 5px 18px rgba(16,36,62,.06);
            display:flex;flex-wrap:wrap;justify-content:flex-start;gap:8px;
            text-align:left;
            backdrop-filter:blur(8px);
        }
        .top-buttons button{
            border:1px solid #cfd7e2;
            border-radius:9px;
            padding:9px 14px;
            font:600 13px "Segoe UI",Arial,sans-serif;
            color:var(--rk-navy);
            background:#fff;
            cursor:pointer;
            transition:all .18s ease;
        }
        .top-buttons button:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(16,36,62,.10);border-color:#aab8ca}
        .top-buttons button:active{transform:translateY(0)}
        .top-buttons .popup-btn{
            background:var(--rk-navy)!important;color:#fff!important;border-color:var(--rk-navy)!important
        }
        .top-buttons .popup-btn:hover{background:var(--rk-navy-2)!important}
        .top-buttons button:last-child{background:#eaf3ff!important;color:#1457a6!important;border-color:#bfd7f5!important}
        .box-wrapper{
            margin:0 0 20px;
            padding:16px;
            background:var(--rk-card);
            border:1px solid var(--rk-border);
            border-radius:16px;
            box-shadow:0 7px 24px rgba(16,36,62,.065);
            page-break-inside:avoid;break-inside:avoid;
        }
        .set-header-row{
            display:flex;justify-content:space-between;align-items:center;gap:12px;
            margin:0 0 12px;padding:0 2px;
            font-size:14px;font-weight:700;color:var(--rk-navy);
        }
        .set-title{
            display:flex;align-items:center;gap:8px;text-align:left;
            font-size:16px;font-weight:800;letter-spacing:.2px;
        }
        .set-title:before{
            content:"";width:4px;height:20px;border-radius:4px;background:var(--rk-gold);display:inline-block
        }
        .pravesh-select{
            width:auto!important;min-width:150px;
            color:var(--rk-navy)!important;background:var(--rk-gold-soft)!important;
            border:1px solid #d8c188!important;border-radius:8px!important;
            padding:7px 10px!important;font-weight:700!important;
        }
        .box-title{
            margin:14px 0 7px;
            padding:8px 12px;
            color:var(--rk-navy);
            background:linear-gradient(90deg,#f3f6fa,#fff);
            border:1px solid var(--rk-border);
            border-left:4px solid var(--rk-gold);
            border-radius:8px;
            font-size:13px;
            font-weight:800;
            text-align:left;
        }
        table{
            width:100%;border-collapse:separate;border-spacing:0;margin:0 0 10px;
            text-align:center;overflow:hidden;border:1px solid var(--rk-border);border-radius:9px;
            background:#fff;
        }
        th,td{
            border:0;border-right:1px solid var(--rk-border);border-bottom:1px solid var(--rk-border);
            padding:7px 6px;font-family:"Segoe UI",Arial,"Noto Sans Devanagari",sans-serif;
            font-size:12px;font-weight:600;text-align:center;vertical-align:middle;word-break:break-word;
        }
        th:last-child,td:last-child{border-right:0}
        tr:last-child td{border-bottom:0}
        th{
            background:var(--rk-navy);color:#fff;font-weight:700;letter-spacing:.1px;
            position:sticky;top:0;z-index:1;
        }
        tbody tr:nth-child(even):not(.seham-row){background:#fafbfd}
        tbody tr:hover:not(.seham-row){background:#f3f7fb}
        .yellow-bg{background:#fff6d8!important;color:var(--rk-navy)!important}
        .red-text{color:var(--rk-red)!important;font-weight:700!important}
        .formula-result{font-weight:700;color:var(--rk-navy);background:#f7f9fc;text-align:center}
        .auto-cell{color:#27364a;background:#fff;text-align:center}
        .fixed-val{color:var(--rk-muted);background:#f8fafc;font-weight:700;text-align:center}
        .seham-row{background:var(--rk-green-soft)!important}
        .seham-name-cell{
            color:var(--rk-green)!important;font-weight:800!important;
            background:var(--rk-green-soft)!important;text-align:left!important
        }
        .seham-val-cell{
            color:#116a4e!important;background:var(--rk-green-soft)!important;
            font-weight:800!important;text-align:center
        }
        select,input{
            width:100%;padding:6px 5px;box-sizing:border-box;text-align:center;
            border:1px solid #cfd7e2;border-radius:6px;background:#fff;color:var(--rk-ink);
            font:600 12px "Segoe UI",Arial,"Noto Sans Devanagari",sans-serif;
            outline:none;
        }
        select:focus,input:focus{border-color:#7f9fc4;box-shadow:0 0 0 3px rgba(46,101,160,.10)}

        .rk-kicker{display:inline-flex;align-items:center;gap:7px;margin-bottom:6px;padding:5px 9px;border-radius:999px;background:#f4ead0;border:1px solid #dfc98e;color:#755916;font-size:10px;font-weight:900;letter-spacing:.7px;text-transform:uppercase}
        .rk-kicker:before{content:"";width:6px;height:6px;border-radius:50%;background:#c8a24d;box-shadow:0 0 0 3px rgba(200,162,77,.15)}
        .rk-section-note{color:#667085;font-size:11px;font-weight:600;margin-top:2px}
        .top-buttons:before{content:"WORKSPACE TOOLS";display:flex;align-items:center;width:100%;font-size:10px;letter-spacing:1.2px;color:#8792a2;font-weight:900;margin:0 2px 2px}
        .top-buttons button{min-height:40px}
        .top-buttons button:first-of-type,.top-buttons button:nth-of-type(2){background:#f8fafc}
        .top-buttons button:nth-of-type(3){box-shadow:0 7px 16px rgba(16,36,62,.16)}
        .rk-footer{border-top:1px solid #d9e0ea;margin-top:10px}

        @media(max-width:760px){
            body{padding:12px 8px 25px}
            .rk-brand{padding:15px;border-radius:14px;align-items:center}
            .rk-brand-left{width:100%;justify-content:center}
            .rk-logo-svg{width:min(470px,94vw)}
            .rk-brand-copy{display:none}
            .rk-status{display:none}
            .box-wrapper{padding:9px;border-radius:12px}
            .set-header-row{align-items:flex-start;flex-direction:column}
            .pravesh-select{width:100%!important}
            table{display:block;overflow-x:auto;white-space:nowrap}
            th,td{font-size:11px;padding:6px 5px}
            .top-buttons{padding:9px}.top-buttons button{flex:1 1 auto}
        }
        @media print{
            body{background:#fff;margin:0;padding:0}
            .rk-brand{box-shadow:none;border-radius:0;margin-bottom:8px}
            .top-buttons,.popup-action-bar{display:none!important}
            .container{width:100%;max-width:none;padding:0}
            .box-wrapper{box-shadow:none;border:1px solid #cfd4da}
            th{background:#10243e!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
            .seham-row,.seham-name-cell,.seham-val-cell{background:#e8f7f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
            .print-page-break{page-break-after:always;break-after:page}
        }

    </style>

            let a = parseInt(ansh);

                if (v5 === v6 && v5 === 0) return "0";

                if (v4 === v6) return "0";

        function saveState() {
            if (isPerformingHistoryAction) return;
            historyStack.push(getFullState());
            redoStack = [];
        }

        function triggerUndo() {
            if (historyStack.length === 0) return;
            redoStack.push(getFullState());
            let prevState = historyStack.pop();
            applyState(prevState);
        }

        function triggerRedo() {
            if (redoStack.length === 0) return;
            historyStack.push(getFullState());
            let nextState = redoStack.pop();
            applyState(nextState);
        }

        function applyState(state) {
            isPerformingHistoryAction = true;
            for (let key in state) {
                let el = document.getElementById(key);
                if (el) el.value = state[key];
                
                let popupWinRef = window.popupWindowInstance;
                if (popupWinRef && !popupWinRef.closed) {
                    try {
                        let pEl = popupWinRef.document.getElementById(key);
                        if (pEl) pEl.value = state[key];
                    } catch(e) {}
                }
            }
            isPerformingHistoryAction = false;
            updateSheet(false);
        }

                } catch(e) {}
            }
